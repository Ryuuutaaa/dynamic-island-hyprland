name: CI

# Tujuan: membuktikan kode ini benar-benar bisa dibangun, bukan sekadar
# "sepertinya bisa".
#
#   Validasi -> cepat (ubuntu): sintaks, bash, logika inti, tidak ada kredensial
#   Build    -> matrix Linux/Windows/macOS: paket benar-benar terbangun
#
# Catatan penting: job build TIDAK mengunggah artefak. Unggahan sempat
# ditambahkan lalu menghasilkan enam run gagal berturut-turut yang tidak bisa
# didiagnosis (log job butuh akses admin, API kena rate limit). Nilai CI ini
# ada pada pembuktian build; distribusi artefak ditangani terpisah.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Validasi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sintaks JavaScript (AGS)
        run: |
          fail=0
          while IFS= read -r file; do
            node --check "$file" || fail=1
          done < <(git ls-files '*.js')
          exit "$fail"

      - name: Sintaks JavaScript (Electron)
        working-directory: desktop
        run: |
          fail=0
          while IFS= read -r file; do
            node --check "$file" || fail=1
          done < <(git ls-files '*.js' '*.mjs')
          exit "$fail"

      - name: Sintaks bash
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tools/test-nav.sh

      - name: Sinkronkan shared/ (logika dipakai bersama)
        working-directory: desktop
        # desktop/src/shared/ adalah salinan hasil generate dari shared/ di root.
        # Tanpa langkah ini, uji core tidak menemukan modul.
        run: node tools/sync-shared.mjs

      - name: Uji logika murni (core.js)
        working-directory: desktop
        run: node tools/verify-core.mjs

      - name: Tidak ada kredensial di repo
        run: |
          if git grep -nE 'AQ\.[A-Za-z0-9_-]{20,}|private-[a-f0-9]{20,}' -- .; then
            echo "::error::Kredensial ditemukan di repo. Hapus sebelum push."
            exit 1
          fi
          echo "OK: tidak ada kredensial"

  build:
    name: Build ${{ matrix.label }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            command: pnpm exec electron-builder --linux --publish never
          - os: windows-latest
            label: Windows
            command: pnpm exec electron-builder --win --publish never
          - os: macos-latest
            label: macOS
            command: pnpm exec electron-builder --mac --publish never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # AppImage di Ubuntu 24.04 butuh libfuse2. Langkah ini hanya berjalan
      # di Linux; di Windows/macOS otomatis dilewati (bukan perintah no-op
      # yang bisa gagal karena quoting shell).
      - name: Prasyarat Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Pasang dependensi
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: desktop
        run: ${{ matrix.command }}
        env:
          # Tanpa sertifikat: artefak tidak ditandatangani. Untuk rilis publik,
          # tambahkan sertifikat lewat secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Bukti yang bisa dibaca langsung di ringkasan langkah, tanpa perlu
      # mengunduh log: paket apa yang dihasilkan.
      - name: Hasil build
        working-directory: desktop
        shell: bash
        run: |
          echo "release/:"
          ls -lh release/ 2>/dev/null || echo "  (tidak ada release/)"
          count=$(find release -maxdepth 1 -type f \
            \( -name '*.AppImage' -o -name '*.deb' -o -name '*.exe' -o -name '*.dmg' \) \
            2>/dev/null | wc -l)
          echo "paket ditemukan: $count"
          test "$count" -gt 0
